<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interaktive Fußball-Taktiktafel</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-white font-sans antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Standard Aufstellungen (Prozentual 0-100 auf dem Feld)
    const PRESETS = {
      "4-3-3": {
        home: [
          { id: 'h1', num: 1, role: 'TW', x: 5, y: 50 },
          { id: 'h2', num: 2, role: 'RV', x: 22, y: 15 },
          { id: 'h3', num: 4, role: 'IV', x: 18, y: 38 },
          { id: 'h4', num: 5, role: 'IV', x: 18, y: 62 },
          { id: 'h5', num: 3, role: 'LV', x: 22, y: 85 },
          { id: 'h6', num: 6, role: '6er', x: 32, y: 50 },
          { id: 'h7', num: 8, role: '8er', x: 40, y: 32 },
          { id: 'h8', num: 10, role: '8er', x: 40, y: 68 },
          { id: 'h9', num: 7, role: 'RA', x: 46, y: 18 },
          { id: 'h10', num: 9, role: 'ST', x: 48, y: 50 },
          { id: 'h11', num: 11, role: 'LA', x: 46, y: 82 }
        ],
        away: [
          { id: 'a1', num: 1, role: 'TW', x: 95, y: 50 },
          { id: 'a2', num: 2, role: 'RV', x: 78, y: 85 },
          { id: 'a3', num: 4, role: 'IV', x: 82, y: 62 },
          { id: 'a4', num: 5, role: 'IV', x: 82, y: 38 },
          { id: 'a5', num: 3, role: 'LV', x: 78, y: 15 },
          { id: 'a6', num: 6, role: '6er', x: 68, y: 50 },
          { id: 'a7', num: 8, role: '8er', x: 60, y: 68 },
          { id: 'a8', num: 10, role: '8er', x: 60, y: 32 },
          { id: 'a9', num: 7, role: 'RA', x: 54, y: 82 },
          { id: 'a10', num: 9, role: 'ST', x: 52, y: 50 },
          { id: 'a11', num: 11, role: 'LA', x: 54, y: 18 }
        ]
      },
      "4-4-2": {
        home: [
          { id: 'h1', num: 1, role: 'TW', x: 5, y: 50 },
          { id: 'h2', num: 2, role: 'RV', x: 22, y: 15 },
          { id: 'h3', num: 4, role: 'IV', x: 18, y: 38 },
          { id: 'h4', num: 5, role: 'IV', x: 18, y: 62 },
          { id: 'h5', num: 3, role: 'LV', x: 22, y: 85 },
          { id: 'h6', num: 7, role: 'RM', x: 38, y: 15 },
          { id: 'h7', num: 6, role: 'ZM', x: 35, y: 38 },
          { id: 'h8', num: 8, role: 'ZM', x: 35, y: 62 },
          { id: 'h9', num: 11, role: 'LM', x: 38, y: 85 },
          { id: 'h10', num: 9, role: 'ST', x: 47, y: 38 },
          { id: 'h11', num: 10, role: 'ST', x: 47, y: 62 }
        ],
        away: [
          { id: 'a1', num: 1, role: 'TW', x: 95, y: 50 },
          { id: 'a2', num: 2, role: 'RV', x: 78, y: 85 },
          { id: 'a3', num: 4, role: 'IV', x: 82, y: 62 },
          { id: 'a4', num: 5, role: 'IV', x: 82, y: 38 },
          { id: 'a5', num: 3, role: 'LV', x: 78, y: 15 },
          { id: 'a6', num: 7, role: 'RM', x: 62, y: 85 },
          { id: 'a7', num: 6, role: 'ZM', x: 65, y: 62 },
          { id: 'a8', num: 8, role: 'ZM', x: 65, y: 38 },
          { id: 'a9', num: 11, role: 'LM', x: 62, y: 15 },
          { id: 'a10', num: 9, role: 'ST', x: 53, y: 62 },
          { id: 'a11', num: 10, role: 'ST', x: 53, y: 38 }
        ]
      }
    };

    function App() {
      const [viewMode, setViewMode] = useState('full'); // 'full', 'half', 'penalty'
      const [homeFormation, setHomeFormation] = useState('4-3-3');
      const [awayFormation, setAwayFormation] = useState('4-4-2');
      const [tool, setTool] = useState('select'); // 'select', 'arrow'
      const [arrowType, setArrowType] = useState('run'); // 'run', 'pass', 'dribble'

      // Spieler- und Ballpositionen
      const [players, setPlayers] = useState(() => PRESETS["4-3-3"].home.concat(PRESETS["4-4-2"].away));
      const [ball, setBall] = useState({ id: 'ball', x: 50, y: 50 });
      const [arrows, setArrows] = useState([]);

      // Drag & Draw State
      const [dragItem, setDragItem] = useState(null);
      const [drawingArrow, setDrawingArrow] = useState(null);

      // Simulation State
      const [isPlaying, setIsPlaying] = useState(false);
      const [progress, setProgress] = useState(0); // 0 bis 1
      const [initialPositions, setInitialPositions] = useState(null);

      const fieldRef = useRef(null);

      // Formationswechsel
      const applyFormations = (hForm, aForm) => {
        const newHome = PRESETS[hForm].home;
        const newAway = PRESETS[aForm].away;
        setPlayers(newHome.concat(newAway));
        setArrows([]);
        setBall({ id: 'ball', x: 50, y: 50 });
        setProgress(0);
        setIsPlaying(false);
      };

      // Transformiere Koordinaten je nach Spielfeldausschnitt
      const getTransformedCoords = (x, y) => {
        if (viewMode === 'half') {
          return { displayX: x * 2, displayY: y };
        }
        if (viewMode === 'penalty') {
          return { displayX: (x - 20) * 3.33, displayY: (y - 15) * 1.42 };
        }
        return { displayX: x, displayY: y };
      };

      // Animation Loop für Simulation
      useEffect(() => {
        let animationFrame;
        if (isPlaying) {
          if (!initialPositions) {
            const startMap = {};
            players.forEach(p => { startMap[p.id] = { x: p.x, y: p.y }; });
            startMap['ball'] = { x: ball.x, y: ball.y };
            setInitialPositions(startMap);
          }

          const startTime = performance.now();
          const duration = 2500; // 2.5 Sekunden

          const animate = (now) => {
            const elapsed = now - startTime;
            const currentProgress = Math.min(elapsed / duration, 1);
            setProgress(currentProgress);

            if (currentProgress < 1) {
              animationFrame = requestAnimationFrame(animate);
            } else {
              setIsPlaying(false);
            }
          };

          animationFrame = requestAnimationFrame(animate);
        }
        return () => cancelAnimationFrame(animationFrame);
      }, [isPlaying]);

      // Berechne aktuelle Positionen während Simulation
      const getAnimatedPos = (item) => {
        if (progress === 0 || !initialPositions || !initialPositions[item.id]) {
          return { x: item.x, y: item.y };
        }
        const start = initialPositions[item.id];
        const arrow = arrows.find(a => a.targetId === item.id);
        if (!arrow) return { x: item.x, y: item.y };

        const currentX = start.x + (arrow.endX - start.x) * progress;
        const currentY = start.y + (arrow.endY - start.y) * progress;
        return { x: currentX, y: currentY };
      };

      // Mouse / Touch Event-Handler für Drag & Drop und Pfeile zeichnen
      const handlePointerDown = (e, item) => {
        e.stopPropagation();
        if (isPlaying) return;

        const rect = fieldRef.current.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const startX = ((clientX - rect.left) / rect.width) * 100;
        const startY = ((clientY - rect.top) / rect.height) * 100;

        if (tool === 'select') {
          setDragItem({ id: item.id, startX, startY });
        } else if (tool === 'arrow') {
          setDrawingArrow({
            targetId: item.id,
            startX: item.x,
            startY: item.y,
            currentX: startX,
            currentY: startY,
            type: arrowType
          });
        }
      };

      const handlePointerMove = (e) => {
        if (isPlaying) return;
        const rect = fieldRef.current.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
        const y = Math.max(0, Math.min(100, ((clientY - rect.top) / rect.height) * 100));

        if (dragItem) {
          if (dragItem.id === 'ball') {
            setBall({ id: 'ball', x, y });
          } else {
            setPlayers(players.map(p => p.id === dragItem.id ? { ...p, x, y } : p));
          }
        } else if (drawingArrow) {
          setDrawingArrow({ ...drawingArrow, currentX: x, currentY: y });
        }
      };

      const handlePointerUp = () => {
        if (dragItem) {
          setDragItem(null);
        }
        if (drawingArrow) {
          // Pfeil speichern
          setArrows(prev => [
            ...prev.filter(a => a.targetId !== drawingArrow.targetId),
            {
              id: Date.now(),
              targetId: drawingArrow.targetId,
              startX: drawingArrow.startX,
              startY: drawingArrow.startY,
              endX: drawingArrow.currentX,
              endY: drawingArrow.currentY,
              type: drawingArrow.type
            }
          ]);
          setDrawingArrow(null);
        }
      };

      const resetSimulation = () => {
        setIsPlaying(false);
        setProgress(0);
        setInitialPositions(null);
      };

      return (
        <div className="flex flex-col lg:flex-row h-screen w-screen overflow-hidden bg-slate-900">
          
          {/* Linke Steuerungsspeiche / Sidebar */}
          <div className="w-full lg:w-80 bg-slate-800 border-r border-slate-700 p-4 flex flex-col gap-5 overflow-y-auto z-10">
            <div>
              <h1 className="text-xl font-bold text-emerald-400 flex items-center gap-2">
                ⚽ Taktikboard Pro
              </h1>
              <p className="text-xs text-slate-400 mt-1">Spielfeld & Wege dynamisch simulieren</p>
            </div>

            {/* Modus Wahl */}
            <div className="space-y-2">
              <label className="text-xs font-semibold text-slate-300 uppercase tracking-wider">Ausschnitt</label>
              <div className="grid grid-cols-3 gap-1 bg-slate-900 p-1 rounded-lg">
                <button onClick={() => setViewMode('full')} className={`py-1.5 text-xs font-medium rounded ${viewMode === 'full' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:text-white'}`}>Ganzes Feld</button>
                <button onClick={() => setViewMode('half')} className={`py-1.5 text-xs font-medium rounded ${viewMode === 'half' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:text-white'}`}>Halbes Feld</button>
                <button onClick={() => setViewMode('penalty')} className={`py-1.5 text-xs font-medium rounded ${viewMode === 'penalty' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:text-white'}`}>Strafraum</button>
              </div>
            </div>

            {/* Werkzeuge */}
            <div className="space-y-2">
              <label className="text-xs font-semibold text-slate-300 uppercase tracking-wider">Werkzeug</label>
              <div className="grid grid-cols-2 gap-2">
                <button onClick={() => setTool('select')} className={`p-2 text-xs font-medium rounded-lg border flex items-center justify-center gap-2 ${tool === 'select' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400' : 'border-slate-700 text-slate-400 hover:bg-slate-700'}`}>
                  ✋ Verschieben
                </button>
                <button onClick={() => setTool('arrow')} className={`p-2 text-xs font-medium rounded-lg border flex items-center justify-center gap-2 ${tool === 'arrow' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400' : 'border-slate-700 text-slate-400 hover:bg-slate-700'}`}>
                  ↗️ Pfeil zeichnen
                </button>
              </div>
            </div>

            {tool === 'arrow' && (
              <div className="space-y-2 bg-slate-900/50 p-3 rounded-lg border border-slate-700">
                <label className="text-xs font-semibold text-slate-300">Pfeil-Typ</label>
                <div className="flex gap-2">
                  <button onClick={() => setArrowType('run')} className={`flex-1 py-1 text-xs rounded border ${arrowType === 'run' ? 'bg-emerald-600 text-white' : 'border-slate-700 text-slate-400'}`}>Laufweg</button>
                  <button onClick={() => setArrowType('pass')} className={`flex-1 py-1 text-xs rounded border ${arrowType === 'pass' ? 'bg-amber-600 text-white' : 'border-slate-700 text-slate-400'}`}>Pass</button>
                </div>
              </div>
            )}

            {/* Aufstellungen */}
            <div className="space-y-3">
              <label className="text-xs font-semibold text-slate-300 uppercase tracking-wider">Formationen</label>
              <div>
                <span className="text-xs text-emerald-400 font-medium block mb-1">🟢 Unser Team (Grün)</span>
                <select value={homeFormation} onChange={(e) => { setHomeFormation(e.target.value); applyFormations(e.target.value, awayFormation); }} className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-white">
                  <option value="4-3-3">4-3-3 (Flügelspiel)</option>
                  <option value="4-4-2">4-4-2 (Kompakt)</option>
                </select>
              </div>
              <div>
                <span className="text-xs text-zinc-300 font-medium block mb-1">⚫ Gegner (Schwarz)</span>
                <select value={awayFormation} onChange={(e) => { setAwayFormation(e.target.value); applyFormations(homeFormation, e.target.value); }} className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-white">
                  <option value="4-4-2">4-4-2 (Kompakt)</option>
                  <option value="4-3-3">4-3-3 (Offensiv)</option>
                </select>
              </div>
            </div>

            {/* Steuerungsknöpfe Simulation */}
            <div className="mt-auto space-y-2 pt-4 border-t border-slate-700">
              <button onClick={() => setIsPlaying(!isPlaying)} className={`w-full py-3 rounded-lg font-bold text-sm flex items-center justify-center gap-2 shadow-lg transition ${isPlaying ? 'bg-amber-500 hover:bg-amber-600 text-slate-950' : 'bg-emerald-500 hover:bg-emerald-600 text-slate-950'}`}>
                {isPlaying ? '⏸️ Simulation Pausieren' : '▶️ Simulation Abspielen'}
              </button>
              <button onClick={resetSimulation} className="w-full py-2 bg-slate-700 hover:bg-slate-600 rounded text-xs text-slate-300 font-medium">
                🔄 Positionen Zurücksetzen
              </button>
              <button onClick={() => setArrows([])} className="w-full py-2 bg-rose-950/40 hover:bg-rose-900/60 border border-rose-800/40 rounded text-xs text-rose-300 font-medium">
                🗑️ Alle Pfeile Löschen
              </button>
            </div>
          </div>

          {/* Hauptbereich: Das Spielfeld */}
          <div className="flex-1 h-full p-4 flex flex-col items-center justify-center relative overflow-hidden bg-slate-950">
            
            {/* Spielfeld Canvas-Behälter */}
            <div 
              ref={fieldRef}
              onPointerMove={handlePointerMove}
              onPointerUp={handlePointerUp}
              className="relative w-full max-w-5xl aspect-[1.5/1] bg-emerald-800 rounded-xl shadow-2xl border-4 border-slate-700 overflow-hidden cursor-crosshair touch-none select-none"
              style={{
                backgroundImage: 'repeating-linear-gradient(90deg, #15803d 0px, #15803d 80px, #166534 80px, #166534 160px)'
              }}
            >
              {/* SVG Markierungen */}
              <svg className="absolute inset-0 w-full h-full pointer-events-none stroke-white/70 fill-none" strokeWidth="2">
                {/* Außenlinie */}
                <rect x="2%" y="3%" width="96%" height="94%" />
                {/* Mittellinie */}
                <line x1="50%" y1="3%" x2="50%" y2="97%" />
                {/* Anstoßkreis */}
                <circle cx="50%" cy="50%" r="12%" />
                <circle cx="50%" cy="50%" r="0.5%" fill="white" />
                {/* Strafräume */}
                <rect x="2%" y="22%" width="16%" height="56%" />
                <rect x="82%" y="22%" width="16%" height="56%" />
                {/* Fünfmeterräume */}
                <rect x="2%" y="36%" width="6%" height="28%" />
                <rect x="92%" y="36%" width="6%" height="28%" />
              </svg>

              {/* Pfeile Rendern */}
              <svg className="absolute inset-0 w-full h-full pointer-events-none z-10">
                <defs>
                  <marker id="arrow-run" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
                  </marker>
                  <marker id="arrow-pass" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
                  </marker>
                </defs>
                
                {arrows.map(a => (
                  <line 
                    key={a.id}
                    x1={`${a.startX}%`} y1={`${a.startY}%`}
                    x2={`${a.endX}%`} y2={`${a.endY}%`}
                    stroke={a.type === 'run' ? '#38bdf8' : '#f59e0b'}
                    strokeWidth="3"
                    strokeDasharray={a.type === 'pass' ? '6,6' : 'none'}
                    markerEnd={`url(#arrow-${a.type})`}
                  />
                ))}

                {drawingArrow && (
                  <line 
                    x1={`${drawingArrow.startX}%`} y1={`${drawingArrow.startY}%`}
                    x2={`${drawingArrow.currentX}%`} y2={`${drawingArrow.currentY}%`}
                    stroke={drawingArrow.type === 'run' ? '#38bdf8' : '#f59e0b'}
                    strokeWidth="3"
                    strokeDasharray="4,4"
                  />
                )}
              </svg>

              {/* Spieler Rendern */}
              {players.map(p => {
                const pos = getAnimatedPos(p);
                const isHome = p.id.startsWith('h');

                return (
                  <div
                    key={p.id}
                    onPointerDown={(e) => handlePointerDown(e, p)}
                    style={{ left: `${pos.x}%`, top: `${pos.y}%` }}
                    className={`absolute -translate-x-1/2 -translate-y-1/2 w-8 h-8 md:w-9 md:h-9 rounded-full flex items-center justify-center font-bold text-xs shadow-xl cursor-grab active:cursor-grabbing z-20 border-2 transition-transform duration-75 ${
                      isHome 
                        ? 'bg-emerald-600 text-white border-emerald-300 shadow-emerald-950/50' 
                        : 'bg-zinc-900 text-white border-zinc-500 shadow-black/80'
                    }`}
                  >
                    {p.num}
                    <span className="absolute -bottom-4 text-[9px] font-medium bg-slate-900/80 px-1 rounded text-slate-300 pointer-events-none">
                      {p.role}
                    </span>
                  </div>
                );
              })}

              {/* Ball Rendern */}
              {(() => {
                const ballPos = getAnimatedPos(ball);
                return (
                  <div
                    onPointerDown={(e) => handlePointerDown(e, ball)}
                    style={{ left: `${ballPos.x}%`, top: `${ballPos.y}%` }}
                    className="absolute -translate-x-1/2 -translate-y-1/2 w-5 h-5 bg-white border-2 border-slate-900 rounded-full shadow-lg cursor-grab active:cursor-grabbing z-30 flex items-center justify-center text-[8px]"
                  >
                    ⚽
                  </div>
                );
              })()}

            </div>

            {/* Simulations Fortschrittsbalken */}
            {isPlaying && (
              <div className="w-full max-w-5xl mt-3 bg-slate-800 rounded-full h-2 overflow-hidden border border-slate-700">
                <div className="bg-emerald-500 h-full transition-all duration-75" style={{ width: `${progress * 100}%` }}></div>
              </div>
            )}
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
