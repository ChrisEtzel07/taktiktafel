    function App() {
      const [viewMode, setViewMode] = useState('full'); // 'full', 'half', 'penalty'
      const [homeFormation, setHomeFormation] = useState('4-3-3');
      const [awayFormation, setAwayFormation] = useState('4-4-2');
      const [tool, setTool] = useState('select'); // 'select', 'arrow'
      const [arrowType, setArrowType] = useState('run'); // 'run', 'pass', 'dribble'
      const [simSpeed, setSimSpeed] = useState(1); // 0.5, 1, 1.5, 2
      const [notes, setNotes] = useState("• Flügel überladen & flach in den Rückraum legen\n• Hoch anpressen bei Rückpass zum TW");

      // Positionen
      const [players, setPlayers] = useState(() => FORMATIONS["4-3-3"].home.concat(FORMATIONS["4-4-2"].away));
      const [ball, setBall] = useState({ id: 'ball', x: 50, y: 50 });
      const [arrows, setArrows] = useState([]);

      // Interaction State
      const [dragItem, setDragItem] = useState(null);
      const [drawingArrow, setDrawingArrow] = useState(null);

      // Animation State
      const [isPlaying, setIsPlaying] = useState(false);
      const [progress, setProgress] = useState(0); 
      const [startPosMap, setStartPosMap] = useState(null);

      const fieldRef = useRef(null);

      // Formation wechseln
      const handleFormationChange = (team, formation) => {
        if (team === 'home') {
          setHomeFormation(formation);
          setPlayers(prev => FORMATIONS[formation].home.concat(prev.filter(p => p.id.startsWith('a'))));
        } else {
          setAwayFormation(formation);
          setPlayers(prev => prev.filter(p => p.id.startsWith('h')).concat(FORMATIONS[formation].away));
        }
        setArrows([]);
        resetSimulation();
      };

      // Animation Loop
      useEffect(() => {
        let animationFrame;
        if (isPlaying) {
          if (!startPosMap) {
            const initialMap = {};
            players.forEach(p => { initialMap[p.id] = { x: p.x, y: p.y }; });
            initialMap['ball'] = { x: ball.x, y: ball.y };
            setStartPosMap(initialMap);
          }

          let lastTime = performance.now();
          const baseDuration = 2500 / simSpeed;

          const animate = (now) => {
            const delta = now - lastTime;
            lastTime = now;
            
            setProgress(prev => {
              const next = prev + (delta / baseDuration);
              if (next >= 1) {
                setIsPlaying(false);
                return 1;
              }
              return next;
            });

            animationFrame = requestAnimationFrame(animate);
          };

          animationFrame = requestAnimationFrame(animate);
        }
        return () => cancelAnimationFrame(animationFrame);
      }, [isPlaying, simSpeed, startPosMap, players, ball]);

      // Aktuelle Position berechnen
      const getAnimatedPos = (item) => {
        if (progress === 0 || !startPosMap || !startPosMap[item.id]) {
          return { x: item.x, y: item.y };
        }
        const start = startPosMap[item.id];
        const arrow = arrows.find(a => a.targetId === item.id);
        if (!arrow) return { x: item.x, y: item.y };

        const currentX = start.x + (arrow.endX - start.x) * progress;
        const currentY = start.y + (arrow.endY - start.y) * progress;
        return { x: currentX, y: currentY };
      };

      // Drag & Draw Handlers
      const handlePointerDown = (e, item) => {
        e.stopPropagation();
        if (isPlaying) return;

        const rect = fieldRef.current.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const startX = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
        const startY = Math.max(0, Math.min(100, ((clientY - rect.top) / rect.height) * 100));

        if (tool === 'select') {
          setDragItem({ id: item.id });
        } else if (tool === 'arrow') {
          setDrawingArrow({
            targetId: item.id,
            startX: item.x,
            startY: item.y,
            currentX: startX,
            currentY: startY,
            type: arrowType
          });
        }
      };

      const handlePointerMove = (e) => {
        if (isPlaying) return;
        const rect = fieldRef.current.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
        const y = Math.max(0, Math.min(100, ((clientY - rect.top) / rect.height) * 100));

        if (dragItem) {
          if (dragItem.id === 'ball') {
            setBall({ id: 'ball', x, y });
          } else {
            setPlayers(players.map(p => p.id === dragItem.id ? { ...p, x, y } : p));
          }
        } else if (drawingArrow) {
          setDrawingArrow({ ...drawingArrow, currentX: x, currentY: y });
        }
      };

      const handlePointerUp = () => {
        setDragItem(null);
        if (drawingArrow) {
          setArrows(prev => [
            ...prev.filter(a => a.targetId !== drawingArrow.targetId),
            {
              id: Date.now(),
              targetId: drawingArrow.targetId,
              startX: drawingArrow.startX,
              startY: drawingArrow.startY,
              endX: drawingArrow.currentX,
              endY: drawingArrow.currentY,
              type: drawingArrow.type
            }
          ]);
          setDrawingArrow(null);
        }
      };

      const resetSimulation = () => {
        setIsPlaying(false);
        setProgress(0);
        setStartPosMap(null);
      };

      // Field Zoom Style
      const getTransformStyle = () => {
        if (viewMode === 'half') return { transform: 'scale(1.8) translateX(22%)', transformOrigin: 'center left' };
        if (viewMode === 'penalty') return { transform: 'scale(2.5) translateX(30%) translateY(0%)', transformOrigin: 'center left' };
        return { transform: 'scale(1) translateX(0%)', transformOrigin: 'center' };
      };

      return (
        <div className="flex flex-col lg:flex-row h-screen w-screen overflow-hidden bg-slate-950 text-slate-100">
          
          {/* SIDEBAR STEUERUNG */}
          <div className="w-full lg:w-96 bg-slate-900 border-r border-slate-800 p-5 flex flex-col gap-5 overflow-y-auto z-20 shadow-2xl">
            <div>
              <div className="flex items-center justify-between">
                <h1 className="text-xl font-black text-emerald-400 tracking-tight flex items-center gap-2">
                  ⚽ TAKTIKBOARD PRO
                </h1>
                <span className="bg-emerald-500/10 text-emerald-400 text-[10px] font-bold px-2 py-0.5 rounded-full border border-emerald-500/20">
                  v2.0 LIVE
                </span>
              </div>
              <p className="text-xs text-slate-400 mt-1">Spielfeld, Wege & Animationen für Trainer</p>
            </div>

            {/* Feldansicht */}
            <div className="space-y-1.5">
              <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Ausschnitt</label>
              <div className="grid grid-cols-3 gap-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800">
                <button onClick={() => setViewMode('full')} className={`py-1.5 text-xs font-semibold rounded-lg transition ${viewMode === 'full' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>Ganzes Feld</button>
                <button onClick={() => setViewMode('half')} className={`py-1.5 text-xs font-semibold rounded-lg transition ${viewMode === 'half' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>Halbfeld</button>
                <button onClick={() => setViewMode('penalty')} className={`py-1.5 text-xs font-semibold rounded-lg transition ${viewMode === 'penalty' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>Strafraum</button>
              </div>
            </div>

            {/* Werkzeug-Wahl */}
            <div className="space-y-1.5">
              <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Werkzeug</label>
              <div className="grid grid-cols-2 gap-2">
                <button onClick={() => setTool('select')} className={`p-2.5 text-xs font-bold rounded-xl border flex items-center justify-center gap-2 transition ${tool === 'select' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400 shadow-lg' : 'border-slate-800 text-slate-400 hover:bg-slate-800'}`}>
                  ✋ Verschieben
                </button>
                <button onClick={() => setTool('arrow')} className={`p-2.5 text-xs font-bold rounded-xl border flex items-center justify-center gap-2 transition ${tool === 'arrow' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400 shadow-lg' : 'border-slate-800 text-slate-400 hover:bg-slate-800'}`}>
                  ↗️ Wege Zeichnen
                </button>
              </div>
            </div>

            {/* Pfeiltypen */}
            {tool === 'arrow' && (
              <div className="space-y-1.5 bg-slate-950 p-3 rounded-xl border border-slate-800 animate-fadeIn">
                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Aktionstyp</label>
                <div className="grid grid-cols-3 gap-1.5">
                  <button onClick={() => setArrowType('run')} className={`py-1.5 text-[11px] font-bold rounded-lg border transition ${arrowType === 'run' ? 'bg-sky-500/20 border-sky-400 text-sky-300' : 'border-slate-800 text-slate-400'}`}>🏃 Laufweg</button>
                  <button onClick={() => setArrowType('pass')} className={`py-1.5 text-[11px] font-bold rounded-lg border transition ${arrowType === 'pass' ? 'bg-amber-500/20 border-amber-400 text-amber-300' : 'border-slate-800 text-slate-400'}`}>⚽ Pass</button>
                  <button onClick={() => setArrowType('dribble')} className={`py-1.5 text-[11px] font-bold rounded-lg border transition ${arrowType === 'dribble' ? 'bg-pink-500/20 border-pink-400 text-pink-300' : 'border-slate-800 text-slate-400'}`}>🌀 Dribbel</button>
                </div>
              </div>
            )}

            {/* Formationen */}
            <div className="space-y-3">
              <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Aufstellungen</label>
              <div className="space-y-2">
                <div>
                  <span className="text-xs text-emerald-400 font-bold block mb-1">🟢 Unser Team (Grün)</span>
                  <select value={homeFormation} onChange={(e) => handleFormationChange('home', e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs font-semibold text-white focus:outline-none focus:border-emerald-500">
                    {Object.keys(FORMATIONS).map(f => <option key={f} value={f}>{f} Formation</option>)}
                  </select>
                </div>
                <div>
                  <span className="text-xs text-slate-300 font-bold block mb-1">⚫ Gegner (Schwarz)</span>
                  <select value={awayFormation} onChange={(e) => handleFormationChange('away', e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs font-semibold text-white focus:outline-none focus:border-slate-600">
                    {Object.keys(FORMATIONS).map(f => <option key={f} value={f}>{f} Formation</option>)}
                  </select>
                </div>
              </div>
            </div>

            {/* Taktik Notizen */}
            <div className="space-y-1.5">
              <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Taktik-Anweisungen</label>
              <textarea 
                value={notes}
                onChange={(e) => setNotes(e.target.value)}
                rows={3}
                placeholder="Notizen für die Mannschaft..."
                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-300 focus:outline-none focus:border-emerald-500 resize-none"
              />
            </div>

            {/* Controls Buttons */}
            <div className="mt-auto space-y-2.5 pt-4 border-t border-slate-800">
              {/* Speed Buttons */}
              <div className="flex items-center justify-between bg-slate-950 p-1.5 rounded-xl border border-slate-800">
                <span className="text-[10px] font-bold text-slate-400 px-2">TEMPO:</span>
                <div className="flex gap-1">
                  {[0.5, 1, 1.5, 2].map(s => (
                    <button key={s} onClick={() => setSimSpeed(s)} className={`px-2 py-0.5 text-[10px] font-bold rounded ${simSpeed === s ? 'bg-emerald-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>{s}x</button>
                  ))}
                </div>
              </div>

              <button 
                onClick={() => setIsPlaying(!isPlaying)} 
                className={`w-full py-3.5 rounded-xl font-black text-sm flex items-center justify-center gap-2 shadow-xl transition transform active:scale-95 ${
                  isPlaying ? 'bg-amber-500 hover:bg-amber-400 text-slate-950' : 'bg-emerald-500 hover:bg-emerald-400 text-slate-950'
                }`}
              >
                {isPlaying ? '⏸️ SIMULATION PAUSIEREN' : '▶️ SIMULATION ABSPIELEN'}
              </button>

              <div className="grid grid-cols-2 gap-2">
                <button onClick={resetSimulation} className="py-2.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs text-slate-300 font-bold transition">
                  🔄 Reset
                </button>
                <button onClick={() => setArrows([])} className="py-2.5 bg-rose-950/40 hover:bg-rose-900/60 border border-rose-800/40 rounded-xl text-xs text-rose-300 font-bold transition">
                  🗑️ Pfeile weg
                </button>
              </div>
            </div>
          </div>

          {/* HAUPTBEREICH: SPIELFELD */}
          <div className="flex-1 h-full p-4 lg:p-8 flex flex-col items-center justify-center relative bg-slate-950 overflow-hidden">
            
            {/* Field Container */}
            <div 
              ref={fieldRef}
              onPointerMove={handlePointerMove}
              onPointerUp={handlePointerUp}
              className="relative w-full max-w-6xl aspect-[1.5/1] bg-emerald-800 rounded-2xl shadow-2xl border-4 border-slate-800 overflow-hidden cursor-crosshair touch-none select-none transition-transform duration-500 ease-out"
              style={{
                ...getTransformStyle(),
                backgroundImage: 'repeating-linear-gradient(90deg, #15803d 0px, #15803d 70px, #166534 70px, #166534 140px)'
              }}
            >
              {/* FIELD SVG LINES */}
              <svg className="absolute inset-0 w-full h-full pointer-events-none stroke-white/80 fill-none" strokeWidth="2.5">
                {/* Outer Boundary */}
                <rect x="2%" y="3%" width="96%" height="94%" rx="4" />
                {/* Halfway Line */}
                <line x1="50%" y1="3%" x2="50%" y2="97%" />
                {/* Center Circle */}
                <circle cx="50%" cy="50%" r="12%" />
                <circle cx="50%" cy="50%" r="0.6%" fill="white" />
                {/* Left Penalty Area */}
                <rect x="2%" y="20%" width="16%" height="60%" />
                <rect x="2%" y="35%" width="6%" height="30%" />
                <circle cx="12%" cy="50%" r="0.5%" fill="white" />
                <path d="M 18% 38% A 12% 12% 0 0 1 18% 62%" />
                {/* Right Penalty Area */}
                <rect x="82%" y="20%" width="16%" height="60%" />
                <rect x="92%" y="35%" width="6%" height="30%" />
                <circle cx="88%" cy="50%" r="0.5%" fill="white" />
                <path d="M 82% 38% A 12% 12% 0 0 0 82% 62%" />
              </svg>

              {/* RENDER ARROWS */}
              <svg className="absolute inset-0 w-full h-full pointer-events-none z-10">
                <defs>
                  <marker id="arrow-run" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
                  </marker>
                  <marker id="arrow-pass" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
                  </marker>
                  <marker id="arrow-dribble" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#ec4899" />
                  </marker>
                </defs>
                
                {arrows.map(a => (
                  <line 
                    key={a.id}
                    x1={`${a.startX}%`} y1={`${a.startY}%`}
                    x2={`${a.endX}%`} y2={`${a.endY}%`}
                    stroke={a.type === 'run' ? '#38bdf8' : a.type === 'pass' ? '#f59e0b' : '#ec4899'}
                    strokeWidth="3.5"
                    strokeDasharray={a.type === 'pass' ? '6,6' : a.type === 'dribble' ? '2,4' : 'none'}
                    markerEnd={`url(#arrow-${a.type})`}
                  />
                ))}

                {drawingArrow && (
                  <line 
                    x1={`${drawingArrow.startX}%`} y1={`${drawingArrow.startY}%`}
                    x2={`${drawingArrow.currentX}%`} y2={`${drawingArrow.currentY}%`}
                    stroke={drawingArrow.type === 'run' ? '#38bdf8' : drawingArrow.type === 'pass' ? '#f59e0b' : '#ec4899'}
                    strokeWidth="3.5"
                    strokeDasharray="4,4"
                  />
                )}
              </svg>

              {/* RENDER PLAYERS */}
              {players.map(p => {
                const pos = getAnimatedPos(p);
                const isHome = p.id.startsWith('h');

                return (
                  <div
                    key={p.id}
                    onPointerDown={(e) => handlePointerDown(e, p)}
                    style={{ left: `${pos.x}%`, top: `${pos.y}%` }}
                    className={`absolute -translate-x-1/2 -translate-y-1/2 w-8 h-8 md:w-10 md:h-10 rounded-full flex items-center justify-center font-black text-xs md:text-sm shadow-2xl cursor-grab active:cursor-grabbing z-20 border-2 transition-transform duration-75 hover:scale-110 ${
                      isHome 
                        ? 'bg-emerald-600 text-white border-emerald-300 shadow-emerald-950/80 ring-2 ring-emerald-500/30' 
                        : 'bg-zinc-950 text-white border-zinc-500 shadow-black/90 ring-2 ring-zinc-400/20'
                    }`}
                  >
                    {p.num}
                    <span className="absolute -bottom-4 text-[9px] font-bold bg-slate-950/90 text-slate-300 px-1 rounded border border-slate-800 pointer-events-none">
                      {p.role}
                    </span>
                  </div>
                );
              })}

              {/* RENDER BALL */}
              {(() => {
                const ballPos = getAnimatedPos(ball);
                return (
                  <div
                    onPointerDown={(e) => handlePointerDown(e, ball)}
                    style={{ left: `${ballPos.x}%`, top: `${ballPos.y}%` }}
                    className="absolute -translate-x-1/2 -translate-y-1/2 w-6 h-6 bg-white border-2 border-slate-900 rounded-full shadow-2xl cursor-grab active:cursor-grabbing z-30 flex items-center justify-center text-xs hover:scale-125 transition-transform"
                  >
                    ⚽
                  </div>
                );
              })()}

            </div>

            {/* TIMELINE SLIDER */}
            <div className="w-full max-w-6xl mt-4 flex items-center gap-4 bg-slate-900 p-3 rounded-xl border border-slate-800">
              <span className="text-xs font-bold text-slate-400">ZEITACHSE</span>
              <input 
                type="range" 
                min="0" 
                max="1" 
                step="0.01" 
                value={progress}
                onChange={(e) => {
                  setIsPlaying(false);
                  setProgress(parseFloat(e.target.value));
                }}
                className="flex-1 accent-emerald-500 h-2 bg-slate-950 rounded-lg cursor-pointer"
              />
              <span className="text-xs font-mono font-bold text-emerald-400 w-12 text-right">
                {Math.round(progress * 100)}%
              </span>
            </div>

          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
