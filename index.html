        away: [

          { id: 'h1', num: 1, role: 'TW', x: 5, y: 50 },

          { id: 'a11', num: 14, role: 'ST', x: 53, y: 38 }
        ]
      }
    };

    function mapFormationToMode(homeForm, awayForm, mode) {
      const homeBase = FORMATIONS[homeForm]?.home || FORMATIONS["4-3-3"].home;
      const awayBase = FORMATIONS[awayForm]?.away || FORMATIONS["4-4-2"].away;

      if (mode === 'half') {
        return [
          ...homeBase.map(p => ({ ...p, x: Math.round((p.x * 0.75 + 10) * 10) / 10 })),
          ...awayBase.map(p => ({ ...p, x: Math.round((p.x * 0.75 + 10) * 10) / 10 }))
        ];
      }

      if (mode === 'penalty') {
        return [
          ...homeBase.map(p => ({
            ...p,
            x: Math.round((15 + p.y * 0.7) * 10) / 10,
            y: Math.round((85 - p.x * 0.7) * 10) / 10
          })),
          ...awayBase.map(p => ({
            ...p,
            x: Math.round((15 + p.y * 0.7) * 10) / 10,
            y: Math.round((15 + (100 - p.x) * 0.7) * 10) / 10
          }))
        ];
      }

      return [...homeBase.map(p => ({ ...p })), ...awayBase.map(p => ({ ...p }))];
    }

    function getDefaultBall(mode) {
      if (mode === 'penalty') return { id: 'ball', x: 50, y: 30 };
      if (mode === 'half') return { id: 'ball', x: 35, y: 50 };
      return { id: 'ball', x: 50, y: 50 };
    }

    function App() {
      const [isMenuOpen, setIsMenuOpen] = useState(false);

      // --- PERSISTENTER STATE MIT LOCALSTORAGE ---
      const [boardMode, setBoardMode] = useState(() => localStorage.getItem('tb_boardMode') || 'full');
      const [homeFormation, setHomeFormation] = useState(() => localStorage.getItem('tb_homeFormation') || '4-3-3');
      const [awayFormation, setAwayFormation] = useState(() => localStorage.getItem('tb_awayFormation') || '4-4-2');
      const [tool, setTool] = useState('select');
      const [arrowType, setArrowType] = useState('run');
      const [simSpeed, setSimSpeed] = useState(1);
      const [notes, setNotes] = useState(() => localStorage.getItem('tb_notes') ?? "• Flügel überladen & flach in den Rückraum legen\n• Zweite Bälle vor dem 16er sichern");

      const [players, setPlayers] = useState(() => {
        const saved = localStorage.getItem('tb_players');
        return saved ? JSON.parse(saved) : mapFormationToMode('4-3-3', '4-4-2', 'full');
      });

      const [ball, setBall] = useState(() => {
        const saved = localStorage.getItem('tb_ball');
        return saved ? JSON.parse(saved) : { id: 'ball', x: 50, y: 50 };
      });

      const [arrows, setArrows] = useState(() => {
        const saved = localStorage.getItem('tb_arrows');
        return saved ? JSON.parse(saved) : [];
      });

      const [dragItem, setDragItem] = useState(null);
      const [drawingArrow, setDrawingArrow] = useState(null);

      const [isPlaying, setIsPlaying] = useState(false);
      const [progress, setProgress] = useState(0);
      const [startPosMap, setStartPosMap] = useState(null);

      const fieldRef = useRef(null);

      // SPEICHER-EFFEKT
      useEffect(() => {
        localStorage.setItem('tb_boardMode', boardMode);
        localStorage.setItem('tb_homeFormation', homeFormation);
        localStorage.setItem('tb_awayFormation', awayFormation);
        localStorage.setItem('tb_notes', notes);
        localStorage.setItem('tb_players', JSON.stringify(players));
        localStorage.setItem('tb_ball', JSON.stringify(ball));
        localStorage.setItem('tb_arrows', JSON.stringify(arrows));
      }, [boardMode, homeFormation, awayFormation, notes, players, ball, arrows]);

      const handleFormationChange = (team, formation) => {
        let newHome = homeFormation;
        let newAway = awayFormation;
        if (team === 'home') {
          setHomeFormation(formation);
          newHome = formation;
        } else {
          setAwayFormation(formation);
          newAway = formation;
        }
        setPlayers(mapFormationToMode(newHome, newAway, boardMode));
        setArrows([]);
        resetSimulation();
      };

      const handleBoardModeChange = (mode) => {
        setBoardMode(mode);
        setPlayers(mapFormationToMode(homeFormation, awayFormation, mode));
        setBall(getDefaultBall(mode));
        setArrows([]);
        resetSimulation();
      };

      // ANIMATIONS-SCHLEIFE
      useEffect(() => {
        let animationFrame;
        if (isPlaying) {
          let lastTime = performance.now();
          const baseDuration = 2500 / simSpeed;

          const animate = (now) => {
            const delta = now - lastTime;
            lastTime = now;

            setProgress(prev => {
              const next = prev + (delta / baseDuration);
              if (next >= 1) {
                setIsPlaying(false);
                return 1;
              }
              return next;
            });

            animationFrame = requestAnimationFrame(animate);
          };

          animationFrame = requestAnimationFrame(animate);
        }
        return () => cancelAnimationFrame(animationFrame);
      }, [isPlaying, simSpeed]);

      const handleTogglePlay = () => {
        if (!isPlaying) {
          if (progress >= 1) {
            setProgress(0);
          }
          const map = {};
          players.forEach(p => { map[p.id] = { x: p.x, y: p.y }; });
          map['ball'] = { x: ball.x, y: ball.y };
          setStartPosMap(map);
          setIsPlaying(true);
        } else {
          setIsPlaying(false);
        }
      };

      const getAnimatedPos = (item) => {
        if (progress === 0 || !startPosMap || !startPosMap[item.id]) {
          return { x: item.x, y: item.y };
        }
        const start = startPosMap[item.id];
        const arrow = arrows.find(a => a.targetId === item.id);
        if (!arrow) return { x: start.x, y: start.y };

        const currentX = start.x + (arrow.endX - start.x) * progress;
        const currentY = start.y + (arrow.endY - start.y) * progress;
        return { x: currentX, y: currentY };
      };

      const getArrowStartPos = (arrow) => {
        if (arrow.targetId === 'ball') return { x: ball.x, y: ball.y };
        const player = players.find(p => p.id === arrow.targetId);
        return player ? { x: player.x, y: player.y } : { x: 50, y: 50 };
      };

      const handlePointerDown = (e, item) => {
        e.stopPropagation();
        if (isPlaying) return;

        const rect = fieldRef.current.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const startX = Math.max(2, Math.min(98, ((clientX - rect.left) / rect.width) * 100));
        const startY = Math.max(2, Math.min(98, ((clientY - rect.top) / rect.height) * 100));

        if (tool === 'select') {
          setDragItem({ id: item.id });
        } else if (tool === 'arrow') {
          setDrawingArrow({
            targetId: item.id,
            startX: item.x,
            startY: item.y,
            currentX: startX,
            currentY: startY,
            type: arrowType
          });
        }
      };

      const handlePointerMove = (e) => {
        if (isPlaying || (!dragItem && !drawingArrow)) return;

        const rect = fieldRef.current.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = Math.max(2, Math.min(98, ((clientX - rect.left) / rect.width) * 100));
        const y = Math.max(2, Math.min(98, ((clientY - rect.top) / rect.height) * 100));

        if (dragItem) {
          if (progress > 0) setProgress(0);
          setStartPosMap(null);

          if (dragItem.id === 'ball') {
            setBall({ id: 'ball', x, y });
          } else {
            setPlayers(prev => prev.map(p => p.id === dragItem.id ? { ...p, x, y } : p));
          }
        } else if (drawingArrow) {
          setDrawingArrow(prev => prev ? { ...prev, currentX: x, currentY: y } : null);
        }
      };

      const handlePointerUp = () => {
        setDragItem(null);
        if (drawingArrow) {
          setArrows(prev => [
            ...prev.filter(a => a.targetId !== drawingArrow.targetId),
            {
              id: Date.now(),
              targetId: drawingArrow.targetId,
              endX: drawingArrow.currentX,
              endY: drawingArrow.currentY,
              type: drawingArrow.type
            }
          ]);
          setDrawingArrow(null);
        }
      };

      const resetSimulation = () => {
        setIsPlaying(false);
        setProgress(0);
        setStartPosMap(null);
      };

      const handleFullReset = () => {
        if (window.confirm("Möchtest du das gesamte Board und alle gespeicherten Aufstellungen & Wege zurücksetzen?")) {
          localStorage.clear();
          setBoardMode('full');
          setHomeFormation('4-3-3');
          setAwayFormation('4-4-2');
          setPlayers(mapFormationToMode('4-3-3', '4-4-2', 'full'));
          setBall({ id: 'ball', x: 50, y: 50 });
          setArrows([]);
          setNotes("• Flügel überladen & flach in den Rückraum legen\n• Zweite Bälle vor dem 16er sichern");
          resetSimulation();
        }
      };

      return (
        <div className="flex flex-col lg:flex-row h-screen w-screen overflow-hidden bg-slate-950 text-slate-100 relative">
          
          {/* MOBILE HEADER BAR */}
          <div className="lg:hidden bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between z-30 shrink-0">
            <button 
              onClick={() => setIsMenuOpen(true)}
              className="flex items-center gap-1.5 px-3 py-1.5 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-xl text-xs font-bold active:scale-95 transition"
            >
              ⚙️ Menü & Taktik
            </button>
            <div className="flex items-center gap-2">
              <button 
                onClick={handleTogglePlay}
                className={`px-3 py-1.5 rounded-xl text-xs font-black shadow-md transition active:scale-95 ${
                  isPlaying ? 'bg-amber-500 text-slate-950' : 'bg-emerald-500 text-slate-950'
                }`}
              >
                {isPlaying ? '⏸️ Pause' : '▶️ Play'}
              </button>
            </div>
          </div>

          {/* MOBILE BACKDROP OVERLAY */}
          {isMenuOpen && (
            <div 
              onClick={() => setIsMenuOpen(false)}
              className="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 lg:hidden"
            />
          )}

          {/* SIDEBAR STEUERUNG */}
          <div className={`
            fixed lg:static inset-y-0 left-0 z-50
            w-80 sm:w-96 bg-slate-900 border-r border-slate-800 p-5 flex flex-col gap-4 overflow-y-auto shadow-2xl
            transition-transform duration-300 ease-in-out
            ${isMenuOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}
          `}>
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <img 
                  src={LOGO_URL} 
                  alt="Team Logo" 
                  className="w-9 h-9 object-contain rounded bg-slate-950/50 p-0.5 border border-slate-800"
                  onError={(e) => { e.target.style.display = 'none'; }}
                />
                <div>
                  <h1 className="text-xl font-black text-emerald-400 tracking-tight flex items-center gap-2">
                    ⚽ TAKTIKBOARD PRO
                  </h1>
                  <p className="text-xs text-slate-400 mt-0.5">Ganzes Feld, Halbfeld & Strafraum</p>
                </div>
              </div>
              <button 
                onClick={() => setIsMenuOpen(false)}
                className="lg:hidden text-slate-400 hover:text-white p-1.5 rounded-lg bg-slate-800 border border-slate-700"
              >
                ✕
              </button>
            </div>

            {/* Tafel-Auswahl */}
            <div className="space-y-1.5">
              <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Taktik-Tafel Wählen</label>
              <div className="grid grid-cols-3 gap-1.5 bg-slate-950 p-1 rounded-xl border border-slate-800">
                <button onClick={() => handleBoardModeChange('full')} className={`py-2 text-xs font-bold rounded-lg transition ${boardMode === 'full' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>Ganzes Feld</button>
                <button onClick={() => handleBoardModeChange('half')} className={`py-2 text-xs font-bold rounded-lg transition ${boardMode === 'half' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>Halbfeld</button>
                <button onClick={() => handleBoardModeChange('penalty')} className={`py-2 text-xs font-bold rounded-lg transition ${boardMode === 'penalty' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>Strafraum</button>
              </div>
            </div>

            {/* Formationen Wählen */}
            <div className="space-y-2.5 bg-slate-950 p-3 rounded-xl border border-slate-800">
              <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block">Aufstellungen / Formationen</label>
              <div className="space-y-2">
                <div>
                  <span className="text-[11px] text-emerald-400 font-bold block mb-1">🟢 Unser Team (Grün)</span>
                  <select value={homeFormation} onChange={(e) => handleFormationChange('home', e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs font-semibold text-white focus:outline-none focus:border-emerald-500">
                    {Object.keys(FORMATIONS).map(f => <option key={f} value={f}>{f} Formation</option>)}
                  </select>
                </div>
                <div>
                  <span className="text-[11px] text-slate-300 font-bold block mb-1">⚫ Gegner (Schwarz)</span>
                  <select value={awayFormation} onChange={(e) => handleFormationChange('away', e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs font-semibold text-white focus:outline-none focus:border-slate-600">
                    {Object.keys(FORMATIONS).map(f => <option key={f} value={f}>{f} Formation</option>)}
                  </select>
                </div>
              </div>
            </div>

            {/* Werkzeuge */}
            <div className="space-y-1.5">
              <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Werkzeug</label>
              <div className="grid grid-cols-2 gap-2">
                <button onClick={() => setTool('select')} className={`p-2.5 text-xs font-bold rounded-xl border flex items-center justify-center gap-2 transition ${tool === 'select' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400 shadow-lg' : 'border-slate-800 text-slate-400 hover:bg-slate-800'}`}>
                  ✋ Verschieben
                </button>
                <button onClick={() => setTool('arrow')} className={`p-2.5 text-xs font-bold rounded-xl border flex items-center justify-center gap-2 transition ${tool === 'arrow' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400 shadow-lg' : 'border-slate-800 text-slate-400 hover:bg-slate-800'}`}>
                  ↗️ Wege Zeichnen
                </button>
              </div>
            </div>

            {/* Pfeiltypen */}
            {tool === 'arrow' && (
              <div className="space-y-1.5 bg-slate-950 p-3 rounded-xl border border-slate-800">
                <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Aktionstyp</label>
                <div className="grid grid-cols-3 gap-1.5">
                  <button onClick={() => setArrowType('run')} className={`py-1.5 text-[11px] font-bold rounded-lg border transition ${arrowType === 'run' ? 'bg-sky-500/20 border-sky-400 text-sky-300' : 'border-slate-800 text-slate-400'}`}>🏃 Laufweg</button>
                  <button onClick={() => setArrowType('pass')} className={`py-1.5 text-[11px] font-bold rounded-lg border transition ${arrowType === 'pass' ? 'bg-amber-500/20 border-amber-400 text-amber-300' : 'border-slate-800 text-slate-400'}`}>⚽ Pass</button>
                  <button onClick={() => setArrowType('dribble')} className={`py-1.5 text-[11px] font-bold rounded-lg border transition ${arrowType === 'dribble' ? 'bg-pink-500/20 border-pink-400 text-pink-300' : 'border-slate-800 text-slate-400'}`}>🌀 Dribbel</button>
                </div>
              </div>
            )}

            {/* Taktik Notizen */}
            <div className="space-y-1.5">
              <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Taktik-Anweisungen</label>
              <textarea 
                value={notes}
                onChange={(e) => setNotes(e.target.value)}
                rows={3}
                placeholder="Notizen für die Mannschaft..."
                className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-300 focus:outline-none focus:border-emerald-500 resize-none"
              />
            </div>

            {/* Controls Buttons */}
            <div className="mt-auto space-y-2.5 pt-3 border-t border-slate-800">
              <div className="flex items-center justify-between bg-slate-950 p-1.5 rounded-xl border border-slate-800">
                <span className="text-[10px] font-bold text-slate-400 px-2">TEMPO:</span>
                <div className="flex gap-1">
                  {[0.5, 1, 1.5, 2].map(s => (
                    <button key={s} onClick={() => setSimSpeed(s)} className={`px-2 py-0.5 text-[10px] font-bold rounded ${simSpeed === s ? 'bg-emerald-500 text-slate-950' : 'text-slate-400 hover:text-white'}`}>{s}x</button>
                  ))}
                </div>
              </div>

              <button 
                onClick={handleTogglePlay} 
                className={`w-full py-3 rounded-xl font-black text-sm flex items-center justify-center gap-2 shadow-xl transition transform active:scale-95 ${
                  isPlaying ? 'bg-amber-500 hover:bg-amber-400 text-slate-950' : 'bg-emerald-500 hover:bg-emerald-400 text-slate-950'
                }`}
              >
                {isPlaying ? '⏸️ SIMULATION PAUSIEREN' : '▶️ SIMULATION ABSPIELEN'}
              </button>

              <div className="grid grid-cols-2 gap-2">
                <button onClick={() => setArrows([])} className="py-2 bg-rose-950/40 hover:bg-rose-900/60 border border-rose-800/40 rounded-xl text-xs text-rose-300 font-bold transition">
                  🗑️ Pfeile weg
                </button>
                <button onClick={handleFullReset} className="py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs text-slate-300 font-bold transition">
                  🔄 Werkseinstellung
                </button>
              </div>
            </div>
          </div>

          {/* HAUPTBEREICH: SPIELFELD */}
          <div className="flex-1 h-full p-2 sm:p-4 lg:p-8 flex flex-col items-center justify-center relative bg-slate-950 overflow-hidden">
            
            {/* Field Container */}
            <div 
              ref={fieldRef}
              onPointerMove={handlePointerMove}
              onPointerUp={handlePointerUp}
              className="relative w-full max-w-6xl aspect-[1.4/1] bg-emerald-800 rounded-xl sm:rounded-2xl shadow-2xl border-2 sm:border-4 border-slate-800 overflow-hidden cursor-crosshair touch-none select-none"
              style={{
                backgroundImage: 'repeating-linear-gradient(90deg, #15803d 0px, #15803d 70px, #166534 70px, #166534 140px)'
              }}
            >
              {/* FESTES LOGO AUF DEM SPIELFELD */}
              <div className="absolute top-3 right-3 sm:top-5 sm:right-5 z-20 pointer-events-none opacity-85 max-w-[45px] max-h-[45px] sm:max-w-[70px] sm:max-h-[70px] filter drop-shadow-lg">
                <img 
                  src={LOGO_URL} 
                  alt="Vereinslogo" 
                  className="w-full h-full object-contain" 
                  onError={(e) => { e.target.style.display = 'none'; }}
                />
              </div>

              {/* SPIELFELD-LINIEN */}
              <svg className="absolute inset-0 w-full h-full pointer-events-none stroke-white/80 fill-none" strokeWidth="2.5">
                {boardMode === 'full' && (
                  <>
                    <rect x="3%" y="4%" width="94%" height="92%" rx="4" />
                    <line x1="50%" y1="4%" x2="50%" y2="96%" />
                    <circle cx="50%" cy="50%" r="13%" />
                    <circle cx="50%" cy="50%" r="0.7%" fill="white" />
                    <rect x="3%" y="20%" width="16%" height="60%" />
                    <rect x="3%" y="35%" width="6%" height="30%" />
                    <circle cx="13%" cy="50%" r="0.7%" fill="white" />
                    <path d="M 19% 38% A 13% 13% 0 0 1 19% 62%" />
                    <rect x="81%" y="20%" width="16%" height="60%" />
                    <rect x="91%" y="35%" width="6%" height="30%" />
                    <circle cx="87%" cy="50%" r="0.7%" fill="white" />
                    <path d="M 81% 38% A 13% 13% 0 0 0 81% 62%" />
                  </>
                )}

                {boardMode === 'half' && (
                  <>
                    <rect x="3%" y="4%" width="94%" height="92%" rx="4" />
                    <line x1="3%" y1="4%" x2="3%" y2="96%" strokeWidth="4" />
                    <path d="M 3% 26% A 24% 24% 0 0 1 3% 74%" />
                    <circle cx="3%" cy="50%" r="0.9%" fill="white" />
                    <rect x="93%" y="41.8%" width="4%" height="16.4%" fill="white/10" strokeWidth="2" />
                    <rect x="61%" y="10%" width="32%" height="80%" />
                    <rect x="81%" y="30%" width="12%" height="40%" />
                    <circle cx="75%" cy="50%" r="0.9%" fill="white" />
                    <path d="M 61% 32% A 20% 20% 0 0 0 61% 68%" />
                  </>
                )}

                {boardMode === 'penalty' && (
                  <>
                    <rect x="5%" y="5%" width="90%" height="87%" rx="2" />
                    <rect x="44%" y="1.5%" width="12%" height="3.5%" strokeWidth="2" fill="white/10" />
                    <rect x="36%" y="5%" width="28%" height="13%" strokeWidth="2.5" />
                    <rect x="22%" y="5%" width="56%" height="32%" strokeWidth="2.5" />
                    <circle cx="50%" cy="26%" r="0.8%" fill="white" />
                    <path d="M 38% 37% A 13% 13% 0 0 0 62% 37%" strokeWidth="2.5" />
                    <path d="M 41% 92% A 9% 9% 0 0 1 59% 92%" strokeWidth="2.5" />
                    <circle cx="50%" cy="92%" r="0.8%" fill="white" />
                    <path d="M 5% 8.5% A 3.5% 3.5% 0 0 0 8.5% 5%" strokeWidth="2" />
                  </>
                )}
              </svg>

              {/* PFEILE RENDERN */}
              <svg className="absolute inset-0 w-full h-full pointer-events-none z-10">
                <defs>
                  <marker id="arrow-run" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
                  </marker>
                  <marker id="arrow-pass" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
                  </marker>
                  <marker id="arrow-dribble" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#ec4899" />
                  </marker>
                </defs>
                
                {arrows.map(a => {
                  const start = getArrowStartPos(a);
                  return (
                    <line 
                      key={a.id}
                      x1={`${start.x}%`} y1={`${start.y}%`}
                      x2={`${a.endX}%`} y2={`${a.endY}%`}
                      stroke={a.type === 'run' ? '#38bdf8' : a.type === 'pass' ? '#f59e0b' : '#ec4899'}
                      strokeWidth="3.5"
                      strokeDasharray={a.type === 'pass' ? '6,6' : a.type === 'dribble' ? '2,4' : 'none'}
                      markerEnd={`url(#arrow-${a.type})`}
                    />
                  );
                })}

                {drawingArrow && (
                  <line 
                    x1={`${drawingArrow.startX}%`} y1={`${drawingArrow.startY}%`}
                    x2={`${drawingArrow.currentX}%`} y2={`${drawingArrow.currentY}%`}
                    stroke={drawingArrow.type === 'run' ? '#38bdf8' : drawingArrow.type === 'pass' ? '#f59e0b' : '#ec4899'}
                    strokeWidth="3.5"
                    strokeDasharray="4,4"
                  />
                )}
              </svg>

              {/* SPIELER RENDERN */}
              {players.map(p => {
                const pos = getAnimatedPos(p);
                const isHome = p.id.startsWith('h');

                return (
                  <div
                    key={p.id}
                    onPointerDown={(e) => handlePointerDown(e, p)}
                    style={{ left: `${pos.x}%`, top: `${pos.y}%` }}
                    className={`absolute -translate-x-1/2 -translate-y-1/2 w-7 h-7 sm:w-9 sm:h-9 md:w-10 md:h-10 rounded-full flex items-center justify-center font-black text-[10px] sm:text-xs md:text-sm shadow-2xl cursor-grab active:cursor-grabbing z-20 border-2 transition-transform duration-75 active:scale-125 ${
                      isHome 
                        ? 'bg-emerald-600 text-white border-emerald-300 shadow-emerald-950/80 ring-2 ring-emerald-500/30' 
                        : 'bg-zinc-950 text-white border-zinc-500 shadow-black/90 ring-2 ring-zinc-400/20'
                    }`}
                  >
                    {p.num}
                    <span className="absolute -bottom-3.5 sm:-bottom-4 text-[8px] sm:text-[9px] font-bold bg-slate-950/90 text-slate-300 px-1 rounded border border-slate-800 pointer-events-none">
                      {p.role}
                    </span>
                  </div>
                );
              })}

              {/* BALL RENDERN */}
              {(() => {
                const ballPos = getAnimatedPos(ball);
                return (
                  <div
                    onPointerDown={(e) => handlePointerDown(e, ball)}
                    style={{ left: `${ballPos.x}%`, top: `${ballPos.y}%` }}
                    className="absolute -translate-x-1/2 -translate-y-1/2 w-5 h-5 sm:w-6 sm:h-6 bg-white border-2 border-slate-900 rounded-full shadow-2xl cursor-grab active:cursor-grabbing z-30 flex items-center justify-center text-[10px] sm:text-xs active:scale-125 transition-transform"
                  >
                    ⚽
                  </div>
                );
              })()}

            </div>

            {/* ZEITACHSEN SLIDER */}
            <div className="w-full max-w-6xl mt-2 sm:mt-4 flex items-center gap-2 sm:gap-4 bg-slate-900 p-2 sm:p-3 rounded-xl border border-slate-800">
              <span className="text-[10px] sm:text-xs font-bold text-slate-400">ZEIT</span>
              <input 
                type="range" 
                min="0" 
                max="1" 
                step="0.01" 
                value={progress}
                onChange={(e) => {
                  setIsPlaying(false);
                  setProgress(parseFloat(e.target.value));
                }}
                className="flex-1 accent-emerald-500 h-2 bg-slate-950 rounded-lg cursor-pointer"
              />
              <span className="text-[10px] sm:text-xs font-mono font-bold text-emerald-400 w-10 sm:w-12 text-right">
                {Math.round(progress * 100)}%
              </span>
            </div>

          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
